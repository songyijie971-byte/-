<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修改密码</title>
  <style>
    :root {
      --bg:
        radial-gradient(circle at top left, rgba(197, 106, 60, 0.16), transparent 28%),
        radial-gradient(circle at bottom right, rgba(47, 107, 102, 0.14), transparent 30%),
        linear-gradient(135deg, #e5dcc9 0%, #f5efe4 100%);
      --panel: rgba(255, 251, 245, 0.92);
      --ink: #1f1812;
      --muted: #6d6255;
      --line: rgba(90, 66, 46, 0.14);
      --brand: #9d4f2e;
      --warn-bg: rgba(178, 123, 40, 0.12);
      --warn-ink: #8b5a18;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .card {
      width: min(580px, 100%);
      background: var(--panel);
      border-radius: 28px;
      padding: 36px;
      box-shadow: 0 28px 80px rgba(63, 39, 22, 0.14);
      border: 1px solid rgba(255,255,255,.48);
    }
    h1 {
      margin: 0;
      font-size: 34px;
    }
    .sub {
      margin: 12px 0 20px;
      color: var(--muted);
      line-height: 1.8;
    }
    .warning {
      margin-bottom: 18px;
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--warn-bg);
      color: var(--warn-ink);
      font-size: 14px;
      line-height: 1.8;
    }
    .error {
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 14px;
      background: #fff1f2;
      color: #be123c;
      font-size: 14px;
    }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }
    .field input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 15px;
      outline: none;
    }
    .field input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
    }
    .submit {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, #9d4f2e, #b97243);
      cursor: pointer;
    }
    .tips {
      margin-top: 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>修改密码</h1>
    <div class="sub">为当前账户设置新的登录密码，建议使用更安全、便于记忆的组合。</div>

    {% if force_password_change %}
    <div class="warning">
      当前账户首次登录后必须修改密码，完成后才能继续正常使用系统。
    </div>
    {% endif %}

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field">
        <label for="password">新密码</label>
        <input id="password" name="password" type="password" minlength="6" placeholder="请输入新密码" required>
      </div>
      <div class="field">
        <label for="confirm_password">确认新密码</label>
        <input id="confirm_password" name="confirm_password" type="password" minlength="6" placeholder="再次输入新密码" required>
      </div>
      <button class="submit" type="submit">保存新密码</button>
    </form>

    <div class="tips">
      建议密码长度不少于 6 位，并避免使用过于简单的默认口令。
    </div>
  </div>
</body>
</html>
