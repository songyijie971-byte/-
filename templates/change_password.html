<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>淇敼瀵嗙爜</title>
  <style>
    :root {
      --bg:
        radial-gradient(circle at top left, rgba(197, 106, 60, 0.16), transparent 28%),
        radial-gradient(circle at bottom right, rgba(47, 107, 102, 0.14), transparent 30%),
        linear-gradient(135deg, #e5dcc9 0%, #f5efe4 100%);
      --panel: rgba(255, 251, 245, 0.92);
      --ink: #1f1812;
      --muted: #6d6255;
      --line: rgba(90, 66, 46, 0.14);
      --brand: #9d4f2e;
      --warn-bg: rgba(178, 123, 40, 0.12);
      --warn-ink: #8b5a18;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .card {
      width: min(580px, 100%);
      background: var(--panel);
      border-radius: 28px;
      padding: 36px;
      box-shadow: 0 28px 80px rgba(63, 39, 22, 0.14);
      border: 1px solid rgba(255,255,255,.48);
    }
    h1 {
      margin: 0;
      font-size: 34px;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    }
    .sub {
      margin: 12px 0 20px;
      color: var(--muted);
      line-height: 1.8;
    }
    .warning {
      margin-bottom: 18px;
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--warn-bg);
      color: var(--warn-ink);
      font-size: 14px;
      line-height: 1.8;
    }
    .error {
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 14px;
      background: #fff1f2;
      color: #be123c;
      font-size: 14px;
    }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }
    .field input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 15px;
      outline: none;
    }
    .field input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
    }
    .submit {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, #9d4f2e, #b97243);
      cursor: pointer;
    }
    .tips {
      margin-top: 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>鍏堜慨鏀圭鐞嗗憳瀵嗙爜</h1>
    <div class="sub">涓洪伩鍏嶉粯璁ゅ彛浠ゅ甫鏉ュ畨鍏ㄩ闄╋紝绯荤粺瑕佹眰榛樿绠＄悊鍛橀娆＄櫥褰曞悗鍏堣缃柊瀵嗙爜锛屽啀缁х画浣跨敤鍚庡彴绠＄悊銆佹憚鍍忓ご鐩戞祴鍜岃棰戝垎鏋愬姛鑳姐€?/div>

    {% if force_password_change %}
    <div class="warning">
      褰撳墠璐﹀彿浠嶅湪浣跨敤榛樿绠＄悊鍛樺瘑鐮併€備慨鏀瑰畬鎴愬墠锛屽叾瀹冮〉闈㈠拰鎺ュ彛灏嗘殏鏃朵笉鍙敤銆?    </div>
    {% endif %}

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field">
        <label for="password">鏂板瘑鐮?/label>
        <input id="password" name="password" type="password" minlength="6" placeholder="璇疯緭鍏ユ柊瀵嗙爜" required>
      </div>
      <div class="field">
        <label for="confirm_password">纭鏂板瘑鐮?/label>
        <input id="confirm_password" name="confirm_password" type="password" minlength="6" placeholder="鍐嶆杈撳叆鏂板瘑鐮? required>
      </div>
      <button class="submit" type="submit">淇濆瓨骞剁户缁?/button>
    </form>

    <div class="tips">
      鏂板瘑鐮佷笉鑳界户缁娇鐢ㄩ粯璁ょ鐞嗗憳瀵嗙爜銆?br>
      淇敼鎴愬姛鍚庝細鑷姩杩涘叆绯荤粺涓婚〉銆?    </div>
  </div>
</body>
</html>
