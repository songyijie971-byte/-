<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册账户</title>
  <style>
    :root {
      --bg:
        radial-gradient(circle at top left, rgba(197, 106, 60, 0.16), transparent 28%),
        radial-gradient(circle at bottom right, rgba(47, 107, 102, 0.14), transparent 30%),
        linear-gradient(135deg, #e5dcc9 0%, #f5efe4 100%);
      --panel: rgba(255, 251, 245, 0.92);
      --ink: #1f1812;
      --muted: #6d6255;
      --line: rgba(90, 66, 46, 0.14);
      --brand: #9d4f2e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .card {
      width: min(560px, 100%);
      background: var(--panel);
      border-radius: 28px;
      padding: 36px;
      box-shadow: 0 28px 80px rgba(63, 39, 22, 0.14);
      border: 1px solid rgba(255,255,255,.48);
    }
    h1 {
      margin: 0;
      font-size: 34px;
    }
    .sub {
      margin: 12px 0 26px;
      color: var(--muted);
      line-height: 1.8;
    }
    .error {
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 14px;
      background: #fff1f2;
      color: #be123c;
      font-size: 14px;
    }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }
    .field input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 15px;
      outline: none;
    }
    .field input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
    }
    .submit {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, #9d4f2e, #b97243);
      cursor: pointer;
    }
    .footer {
      margin-top: 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }
    .footer a {
      color: var(--brand);
      text-decoration: none;
      font-weight: 700;
    }
    .tip {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(47, 107, 102, 0.08);
      color: #2f6b66;
      font-size: 14px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>创建账户</h1>
    <div class="sub">填写基础信息后即可创建新的登录账户，用于进入课堂行为分析平台。</div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" minlength="3" placeholder="请输入用户名" required>
      </div>
      <div class="field">
        <label for="email">邮箱</label>
        <input id="email" name="email" type="email" placeholder="请输入邮箱地址" required>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" minlength="6" placeholder="至少 6 位密码" required>
      </div>
      <div class="field">
        <label for="confirm_password">确认密码</label>
        <input id="confirm_password" name="confirm_password" type="password" minlength="6" placeholder="再次输入密码" required>
      </div>
      <button class="submit" type="submit">完成注册</button>
    </form>

    <div class="tip">
      建议注册后立即修改默认资料，并为课堂演示准备独立账户，便于区分管理员、教师与普通用户权限。
    </div>

    <div class="footer">
      已有账户？<a href="/login">返回登录</a>
    </div>
  </div>
</body>
</html>
